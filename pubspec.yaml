name: newspanda
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  http: ^1.1.0
  get_it: ^7.6.4
  webview_flutter: ^4.4.2
  url_launcher: ^6.2.1
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  intl: ^0.18.1
  connectivity_plus: ^5.0.2
  flutter_dotenv: ^6.0.0
  dartz: ^0.10.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  mocktail: ^1.0.1
  bloc_test: ^9.1.4
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/newspanda.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/newspanda.png